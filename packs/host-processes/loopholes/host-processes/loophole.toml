# The `host-processes` loophole, shipped by the official `host-processes` pack: an allowlisted
# read-only view of host processes. internal/hostprocesses is the daemon and cmd/yolo-ps the
# jail-side CLI wrapper, both baked: an official pack may name a baked client
# (docs/reference/pack-binaries.md).
name = "host-processes"
description = "Allowlisted view of host processes (yolo-ps). Visibility is controlled by this loophole's own `visible` setting."
version = 1
default_enabled = false
# Three gates answer three questions, and OQ-A5 keeps all three on purpose: select the pack (is it
# installed), switch the loophole on (is it running; off by default), and list the names (what may
# it show). Collapsing them would mean a non-empty `visible` list silently starting a host daemon.
# This loophole is nothing but host access (a daemon on the real machine reading the real process
# table), and an empty `visible` list shows nothing.
#
# Linux and darwin. Declared rather than probed: `requires` asks whether a thing is present (the
# fix is to install it), `platforms` asks whether it exists for this machine at all. The daemon
# has two ps dialects chosen by the host's OS (internal/hostprocesses, "Two ps dialects"): GNU
# procps (`ps -o … -C <comm>`, `--forest`, /proc/<pid>/comm) on Linux, and on a Mac a BSD arm that
# asks ps only for `-ax`, `-o` and `-p`, matches the allowlist in Go and draws the tree itself. The
# macos-user launch stages `yolo-ps` into its sandbox whenever this loophole's endpoint is
# published (macosuser.GuestClients).
#
# On a Mac a `visible` name is matched against `ucomm`, the kernel's accounting name (at most 16
# bytes, darwin's analog of /proc/<pid>/comm); BSD `comm` there is argv[0], often a full path. List
# mode compares names as GNU `ps -C` does, on their first 15 bytes once they are that long, so a
# name written for Linux list mode finds the same program on a Mac. Pid and tree mode compare the
# whole name, so there a long name is written as each kernel cuts it: 15 bytes on Linux, 16 on a
# Mac. A program that names itself differently on the two (node's Linux task name is
# `MainThread`) needs both names. A `comm` in `fields` is shown as `ucomm`, the name the allowlist
# matched.
#
# On macos-user this window is exactly what the agent lacks, since the Seatbelt profile denies it
# another process's command line (internal/macosuser/seatbelt.go, cross-process-procargs-deny).
platforms = ["linux", "darwin"]
# `ps` is a POSIX staple, but the probe keeps this honest: if it is missing the loophole goes
# inactive rather than crashing. It is not the platform gate and never tells GNU ps from BSD ps;
# the daemon picks its dialect from the host's OS, and its doctor_cmd asks that ps its own first
# question (`yolo check` fails, naming the fix, when the answer is wrong).
requires = { command_on_path = "ps" }
transport = "loopback-tls"
lifecycle = "spawned"
# The doctor reads the same settings file the daemon does, so the two cannot disagree about which
# file is in force.
doctor_cmd = ["yolo", "internal", "daemon", "host-processes", "--self-check", "--settings", "{settings}"]

# The loophole owns its config keys (docs/reference/pack-system.md); core's schema names none.
# Two behaviors moved with them, and both are the point:
#
#   Frozen at launch. yolo resolves these once and writes them to the file {settings} names, so an
#   agent cannot widen its own allowlist mid-session with no relaunch and no config-approval gate;
#   a change needs a restart (OQ-K3).
#
#   Scope is declared, per key. Both are `workspace`, which is what these keys have always been.
#   It is safe because a workspace value reaches this host daemon only through the config-change
#   approval flow (OQ-K2), and it is now said rather than assumed: the default for an undeclared
#   scope is `user`, so a widening key has to ask.
[settings.visible]
type = "string_list"
scope = "workspace"
default = []
# Empty means the loophole shows nothing: a daemon with an empty allowlist, not a view of the host.
description = "process comm names yolo-ps may reveal; `yolo-ps --tree` also shows every process below one, with its command line (empty = show nothing)"

[settings.fields]
type = "string_list"
scope = "workspace"
# The `ps -o` column list. Declared here rather than left to the daemon's DefaultFields so that
# `yolo config dump` and the settings file show what is in force. The daemon keeps the same list as
# its fallback for a settings file it cannot read.
default = ["pid", "comm", "args", "etime", "%cpu", "%mem", "rss"]
description = "ps -o columns returned to the jail"

# No TLS intercept: the jail reaches the daemon through the `yolo-ps` client, which reads the
# endpoint file named by YOLO_SERVICE_HOST_PROCESSES_ENDPOINT and dials the pinned,
# token-authenticated loopback listener it describes. There is no token env var: the token lives in
# that file and nowhere else.
#
# `publishes = "socket"`: the daemon binds a plain AF_UNIX socket at `{socket}` and yolo runs the
# front over it, so the endpoint file's mode, key persistence, constant-time token compare and
# length cap are the framework's code. The jail-facing names (the env var, and the in-jail path
# /run/yolo-services/host-processes.endpoint) are functions of the loophole name and the transport
# alone; the socket is bound outside the :rw-mounted services dir.
#
# `preamble` stays at its default (on): every connection carries the framework's preamble and
# hostservice.ServeFrontedUnix reads it, so the crossing record and the access line name the same
# jail by construction (loophole-transport.md, "The connection preamble"). `request_end` stays at
# "framed": hostservice reads exactly one frame and never to EOF.
#
# `{settings}` resolves to the file yolo writes from the declarations above after validating the
# user's values. It is a path and not an env map on purpose: `loopholes.<name>.env` is user-scope
# only because it reaches a host daemon's spawn environment, and a path is the one thing a spawn
# may carry.
[host_daemon]
cmd = ["yolo", "internal", "daemon", "host-processes", "--socket", "{socket}", "--settings", "{settings}"]
publishes = "socket"
